<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2eb;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #7a7a72;
    --border: #e0ddd4;
    --accent: #2c5f4a;
    --accent-light: #e1f0e8;
    --miss: #e8e4dc;
    --radius: 12px;
    --canvas-miss: #e8e4dc;
    --canvas-bg: #f5f2eb;
    --canvas-label: #7a7a72;
  }

  body.dark {
    --bg: #161614;
    --surface: #1f1f1c;
    --text: #ffffff;
    --muted: #ffffff;
    --border: #2e2e28;
    --accent: #3d8b6a;
    --accent-light: #1a3328;
    --miss: #2a2a26;
    --canvas-miss: #2a2a26;
    --canvas-bg: #161614;
    --canvas-label: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  *:not(canvas) {
    transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* SETUP SCREEN */
  #setup-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  .setup-card {
    background: var(--surface);
    border-radius: 20px;
    border: 1px solid var(--border);
    padding: 2rem 1.5rem;
    width: 100%;
    max-width: 560px;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 0.25rem;
  }

  .logo span { color: var(--accent); }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .month-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
  }

  .habits-section { margin-bottom: 1.5rem; }

  .habit-input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .habit-input-row input {
    flex: 1;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .habit-input-row input:focus { border-color: var(--accent); }

  .remove-btn {
    width: 32px;
    height: 36px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .remove-btn:hover { background: #fff0f0; border-color: #f0b0b0; color: #c0392b; }

  .add-habit-btn {
    width: 100%;
    padding: 0.5rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    margin-top: 0.25rem;
  }

  .add-habit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .color-section { margin-bottom: 1.75rem; }

  .color-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .color-preset {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .color-preset:hover { transform: scale(1.15); }
  .color-preset.selected { border-color: var(--text); transform: scale(1.15); }

  .color-custom {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    position: relative;
  }

  .color-custom input[type="color"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .generate-btn {
    width: 100%;
    padding: 0.875rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .generate-btn:hover { opacity: 0.9; }
  .generate-btn:active { transform: scale(0.98); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spinIn {
    from { opacity: 0; transform: rotate(-45deg) scale(0.85); }
    to   { opacity: 1; transform: rotate(0deg) scale(1); }
  }

  #tracker-screen.animate-in {
    animation: fadeInUp 0.35s ease both;
  }

  #radial-canvas.animate-in {
    animation: spinIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* TRACKER SCREEN */
  #tracker-screen {
    display: none;
    min-height: 100vh;
    padding: 0;
    max-width: 100%;
    flex-direction: column;
  }

  .tracker-header {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .tracker-header-left {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0.875rem 1rem 0.875rem 1.5rem;
    border-right: 1px solid var(--border);
  }

  .tracker-header-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.875rem 1rem;
  }

  .tracker-header-right {
    display: flex;
    justify-content: flex-end;
    padding: 0.875rem 1.5rem 0.875rem 0;
  }

  .tracker-body {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 56px);
  }

  .habits-sidebar {
    width: 280px;
    flex-shrink: 0;
    padding: 1.25rem 1rem;
    border-right: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .habits-sidebar .legend-card {
    border: none;
    padding: 0;
    margin-bottom: 0;
    flex: 1;
  }

  .habits-sidebar .reset-btn {
    margin-top: auto;
  }

  .chart-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    min-width: 0;
  }

  .tracker-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--text);
  }

  .tracker-month {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .back-btn {
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* RADIAL CHART */
  .chart-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0.5rem 0 1.25rem;
  }

  #radial-canvas {
    touch-action: none;
    display: block;
  }

  .chart-center-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .chart-center-label .month-label {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
  }

  .chart-center-label .year-label {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
    display: block;
  }

  /* LEGEND */
  .legend-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .legend-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideOutLeft {
    from { opacity: 1; transform: translateX(0); }
    to   { opacity: 0; transform: translateX(-16px); }
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 13px;
    color: var(--text);
  }

  .legend-num {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 500;
  }

  /* DARK MODE TOGGLE */
  .theme-toggle {
    width: 40px;
    height: 22px;
    background: var(--border);
    border-radius: 11px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .theme-toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }

  body.dark .theme-toggle { background: var(--accent); }
  body.dark .theme-toggle::after { transform: translateX(18px); background: #fff; }

  .tracker-header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* COLOR FAB + POPUP */
  .color-fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.25rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: transform 0.15s;
    background: var(--accent);
  }

  .color-fab:hover { transform: scale(1.08); }
  .color-fab-icon { font-size: 18px; pointer-events: none; user-select: none; }

  .color-popup {
    position: fixed;
    bottom: 5.5rem;
    right: 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.625rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 99;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    width: 48px;
  }

  .color-popup.open { display: flex; }

  .color-popup-label { display: none; }

  .color-popup-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .cp-swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }

  .cp-swatch:hover { transform: scale(1.2); }

  .cp-swatch.active {
    border-color: var(--text);
    box-shadow: 0 0 0 1px var(--bg);
  }

  .cp-close-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    margin-top: 2px;
  }

  .cp-close-btn:hover { border-color: #c0392b; color: #c0392b; }

  .legend-remove-btn {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    line-height: 1;
    padding: 0;
  }

  .legend-remove-btn:hover { background: #fff0f0; border-color: #f0b0b0; color: #c0392b; }

  .add-habit-inline {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.75rem;
  }

  .add-habit-inline input {
    flex: 1;
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .add-habit-inline input:focus { border-color: var(--accent); }

  .reset-btn {
    display: block;
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    margin-top: 0.75rem;
    transition: all 0.15s;
  }

  .reset-btn:hover { border-color: #c0392b; color: #c0392b; }

  .confirm-bar {
    display: none;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    background: #fff5f5;
    border: 1px solid #f5c0c0;
    border-radius: 10px;
    font-size: 12px;
    color: #c0392b;
    font-family: 'DM Mono', monospace;
  }

  .confirm-bar span { flex: 1; }

  .confirm-yes {
    padding: 0.35rem 0.75rem;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }

  .confirm-no {
    padding: 0.35rem 0.75rem;
    background: transparent;
    color: #c0392b;
    border: 1px solid #f5c0c0;
    border-radius: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }

  .tooltip {
    position: fixed;
    background: rgba(26,26,26,0.88);
    color: #fff;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    pointer-events: none;
    display: none;
    z-index: 200;
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.25rem;">
      <div class="logo">habit<span>.</span></div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" style="margin-top:0.5rem;"></button>
    </div>
    <div class="tagline">Monthly Radial Tracker</div>

    <div class="month-row">
      <div>
        <label>Month</label>
        <select id="sel-month">
          <option value="0">January</option><option value="1">February</option>
          <option value="2">March</option><option value="3">April</option>
          <option value="4">May</option><option value="5">June</option>
          <option value="6">July</option><option value="7">August</option>
          <option value="8">September</option><option value="9">October</option>
          <option value="10">November</option><option value="11">December</option>
        </select>
      </div>
      <div>
        <label>Year</label>
        <input type="text" id="inp-year" value="" maxlength="4" placeholder="2026">
      </div>
    </div>

    <div class="habits-section">
      <label>Habits</label>
      <div id="habit-inputs"></div>
      <button class="add-habit-btn" onclick="addHabitInput()">+ add habit</button>
    </div>

    <button class="generate-btn" onclick="generateTracker()">Generate Tracker →</button>
  </div>
</div>

<!-- TRACKER SCREEN -->
<div id="tracker-screen">
  <div class="tracker-header">
    <div class="tracker-header-left">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode"></button>
    </div>
    <div class="tracker-header-center">
      <div class="tracker-title">habit<span style="color:var(--accent)">.</span></div>
      <div class="tracker-month" id="tracker-month-label"></div>
    </div>
    <div class="tracker-header-right">
      <button class="back-btn" onclick="showSetup()">← edit</button>
    </div>
  </div>

  <div class="tracker-body">
    <!-- LEFT: habits sidebar -->
    <div class="habits-sidebar">
      <div class="legend-card">
        <div class="legend-title">Habits</div>
        <div class="legend-list" id="legend-list"></div>
        <div class="add-habit-inline" id="add-habit-inline" style="display:none;">
          <input type="text" id="new-habit-input" placeholder="e.g. Exercise" onkeydown="if(event.key==='Enter')confirmAddHabit();if(event.key==='Escape')cancelAddHabit();">
          <button class="confirm-yes" style="white-space:nowrap;" onclick="confirmAddHabit()">Add</button>
          <button class="confirm-no" onclick="cancelAddHabit()">Cancel</button>
        </div>
        <button class="add-habit-btn" id="add-habit-tracker-btn" onclick="showAddHabitInline()">+ add habit</button>
      </div>

      <button class="reset-btn" id="reset-btn" onclick="showResetConfirm()">Reset all data</button>
      <div class="confirm-bar" id="confirm-bar">
        <span>Clear all marks for this month?</span>
        <button class="confirm-no" onclick="hideResetConfirm()">Cancel</button>
        <button class="confirm-yes" onclick="confirmReset()">Reset</button>
      </div>
    </div>

    <!-- RIGHT: radial chart -->
    <div class="chart-col">
      <div class="chart-wrapper">
        <canvas id="radial-canvas"></canvas>
        <div class="chart-center-label" id="center-label">
          <span class="month-label" id="center-month"></span>
          <span class="year-label" id="center-year"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Color vertical bar -->
<div class="color-popup" id="color-popup">
  <button class="cp-close-btn" id="cp-close-btn" onclick="closeColorPopup()" title="Close">×</button>
  <div class="color-popup-grid" id="cp-grid"></div>
</div>

<!-- Reopen FAB -->
<div class="color-fab" id="color-fab" onclick="openColorPopup()" title="Pick colour">
  <span class="color-fab-icon">🎨</span>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let selectedColor = '#2c5f4a';
let habits = [];
let monthIndex = 0;
let year = 2026;
let daysInMonth = 31;
let markedCells = {}; // key: "day-habitIdx" => color string
let storageKey = '';

// Canvas drawing state
let canvas, ctx;
let segments = []; // {day, habitIdx, x, y, w, h, path} — using arc paths
let cellPaths = []; // for hit testing

const now = new Date();

// Init
document.getElementById('sel-month').value = now.getMonth();
document.getElementById('inp-year').value = now.getFullYear();

const savedHabits = localStorage.getItem('habit_list');
const initHabits = savedHabits ? JSON.parse(savedHabits) : ['Wake up early','Drink water','Read 10 pages'];
initHabits.forEach(h => addHabitInput(h));

function addHabitInput(val='') {
  const wrap = document.getElementById('habit-inputs');
  const row = document.createElement('div');
  row.className = 'habit-input-row';
  row.innerHTML = `<input type="text" placeholder="e.g. Exercise" value="${val}"><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
  row.querySelector('input').focus();
}

function pickPreset(el) {
  document.querySelectorAll('.color-preset').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

function pickCustom(val) {
  selectedColor = val;
  document.querySelectorAll('.color-preset').forEach(e => e.classList.remove('selected'));
  if (canvas) redraw();
}

const PALETTE = [
  '#2c5f4a','#16a085','#1a6b9e','#3949ab',
  '#8e44ad','#c0392b','#e67e22','#d4ac0d',
  '#1a1a1a','#78909c',
];

function buildColorPopup() {
  const grid = document.getElementById('cp-grid');
  grid.innerHTML = '';
  PALETTE.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'cp-swatch' + (color === selectedColor ? ' active' : '');
    sw.style.background = color;
    sw.title = color;
    sw.onclick = () => pickPopupColor(color);
    grid.appendChild(sw);
  });
}

function pickPopupColor(color) {
  selectedColor = color;
  document.querySelectorAll('.cp-swatch').forEach(s => {
    s.classList.toggle('active', s.style.background === hexToRgb(color) || s.title === color);
  });
  buildLegend();
  redraw();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function closeColorPopup() {
  document.getElementById('color-popup').classList.remove('open');
  document.getElementById('color-fab').style.display = 'flex';
}

function openColorPopup() {
  buildColorPopup();
  document.getElementById('color-popup').classList.add('open');
  document.getElementById('color-fab').style.display = 'none';
}

function generateTracker() {
  const inputs = document.querySelectorAll('#habit-inputs input[type="text"]');
  habits = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
  if (habits.length === 0) { alert('Please add at least one habit.'); return; }
  localStorage.setItem('habit_list', JSON.stringify(habits));

  monthIndex = parseInt(document.getElementById('sel-month').value);
  year = parseInt(document.getElementById('inp-year').value) || now.getFullYear();
  daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

  storageKey = `habit_${year}_${monthIndex}`;
  const saved = localStorage.getItem(storageKey);
  markedCells = saved ? JSON.parse(saved) : {};

  document.getElementById('setup-screen').style.display = 'none';
  const ts = document.getElementById('tracker-screen');
  ts.style.display = 'flex';
  ts.classList.remove('animate-in');
  requestAnimationFrame(() => ts.classList.add('animate-in'));

  // Auto-open the colour bar, hide FAB
  buildColorPopup();
  document.getElementById('color-popup').classList.add('open');
  document.getElementById('color-fab').style.display = 'none';

  document.getElementById('tracker-month-label').textContent = `${MONTHS[monthIndex]} ${year}`;
  document.getElementById('center-month').textContent = MONTH_SHORT[monthIndex];
  document.getElementById('center-year').textContent = year;

  buildLegend();
  setupCanvas(true);
  updateStats();
}

function buildLegend() {
  const list = document.getElementById('legend-list');
  list.innerHTML = '';
  habits.forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.animation = `slideInLeft 0.25s ease both`;
    item.style.animationDelay = `${i * 40}ms`;
    item.innerHTML = `
      <div class="legend-num" style="background:${selectedColor}">${i+1}</div>
      <span style="flex:1">${h}</span>
      <button class="legend-remove-btn" onclick="removeHabit(${i})" title="Remove">×</button>
    `;
    list.appendChild(item);
  });
}

function setupCanvas(animate = false) {
  canvas = document.getElementById('radial-canvas');
  ctx = canvas.getContext('2d');

  const chartCol = canvas.closest('.chart-col') || document.body;
  const availW = chartCol.clientWidth - 48;
  const availH = window.innerHeight - 56 - 48;
  const size = Math.min(availW, availH, 620);
  canvas.width = size;
  canvas.height = size;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';

  if (animate) {
    canvas.classList.remove('animate-in');
    requestAnimationFrame(() => canvas.classList.add('animate-in'));
  }

  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('mousemove', handleMouseMove);
  canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display='none'; });
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleCanvasClick(e); }, { passive: false });

  redraw();
}

function getArcParams(size) {
  const cx = size / 2, cy = size / 2;
  const labelMargin = size * 0.10; // space reserved for day number labels
  const innerR = size * 0.18;
  const outerR = size * 0.5 - labelMargin;
  const ringW = (outerR - innerR) / habits.length;
  return { cx, cy, innerR, outerR, ringW };
}

function redraw() {
  const size = canvas.width;
  const { cx, cy, innerR, outerR, ringW } = getArcParams(size);
  ctx.clearRect(0, 0, size, size);

  cellPaths = [];

  const totalDays = daysInMonth;
  const anglePerDay = (2 * Math.PI) / totalDays;
  const gap = 0.018;

  const fontSize = Math.max(7, size * 0.024);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Read CSS vars for theme-aware colors
  const style = getComputedStyle(document.body);
  const missColor = style.getPropertyValue('--canvas-miss').trim() || '#e8e4dc';
  const bgColor = style.getPropertyValue('--canvas-bg').trim() || '#f5f2eb';
  const labelColor = style.getPropertyValue('--canvas-label').trim() || '#7a7a72';

  // Draw cells + labels
  for (let d = 1; d <= totalDays; d++) {
    const dayAngle = -Math.PI / 2 + (d - 1) * anglePerDay;
    const midAngle = dayAngle + anglePerDay / 2;

    // Day number label — placed just outside the outermost ring
    const labelR = outerR + size * 0.055;
    const lx = cx + Math.cos(midAngle) * labelR;
    const ly = cy + Math.sin(midAngle) * labelR;
    ctx.font = `${fontSize}px DM Mono, monospace`;
    ctx.fillStyle = labelColor;
    ctx.fillText(d, lx, ly);

    for (let h = 0; h < habits.length; h++) {
      const ringIdx = habits.length - 1 - h;
      const r1 = innerR + ringIdx * ringW + 1;
      const r2 = innerR + (ringIdx + 1) * ringW - 1;
      const a1 = dayAngle + gap;
      const a2 = dayAngle + anglePerDay - gap;
      const key = `${d}-${h}`;
      const marked = markedCells[key];

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1);
      ctx.arc(cx, cy, r2, a1, a2);
      ctx.arc(cx, cy, r1, a2, a1, true);
      ctx.closePath();

      ctx.fillStyle = marked ? marked : missColor;
      ctx.fill();

      cellPaths.push({ day: d, habitIdx: h, cx, cy, r1, r2, a1, a2, key });
    }
  }

  // Inner circle fill
  ctx.beginPath();
  ctx.arc(cx, cy, innerR - 1, 0, 2 * Math.PI);
  ctx.fillStyle = bgColor;
  ctx.fill();
}

function pointInCell(px, py, cell) {
  const { cx, cy, r1, r2, a1, a2 } = cell;
  const dx = px - cx, dy = py - cy;
  const r = Math.sqrt(dx*dx + dy*dy);
  if (r < r1 || r > r2) return false;
  let angle = Math.atan2(dy, dx);
  // Normalize angles
  let na1 = a1, na2 = a2;
  while (na1 < -Math.PI) { na1 += 2*Math.PI; na2 += 2*Math.PI; }
  while (na2 > Math.PI) { na1 -= 2*Math.PI; na2 -= 2*Math.PI; }
  if (na1 > na2) { const tmp = na1; na1 = na2; na2 = tmp; }
  // Adjust angle
  while (angle < na1 - 0.01) angle += 2*Math.PI;
  while (angle > na2 + 0.01) angle -= 2*Math.PI;
  return angle >= na1 && angle <= na2;
}

function getCellFromPoint(px, py) {
  for (let i = cellPaths.length - 1; i >= 0; i--) {
    if (pointInCell(px, py, cellPaths[i])) return cellPaths[i];
  }
  return null;
}

function getCanvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY,
    clientX, clientY
  };
}

function handleCanvasClick(e) {
  const { x, y } = getCanvasXY(e);
  const cell = getCellFromPoint(x, y);
  if (!cell) return;
  if (markedCells[cell.key]) {
    delete markedCells[cell.key];
  } else {
    markedCells[cell.key] = selectedColor;
  }
  localStorage.setItem(storageKey, JSON.stringify(markedCells));
  redraw();
  updateStats();
}

function handleMouseMove(e) {
  const { x, y, clientX, clientY } = getCanvasXY(e);
  const cell = getCellFromPoint(x, y);
  const tt = document.getElementById('tooltip');
  if (cell) {
    canvas.style.cursor = 'pointer';
    tt.style.display = 'block';
    tt.style.left = (clientX + 12) + 'px';
    tt.style.top = (clientY - 28) + 'px';
    tt.textContent = `Day ${cell.day} · ${habits[cell.habitIdx]}`;
  } else {
    canvas.style.cursor = 'default';
    tt.style.display = 'none';
  }
}

function showAddHabitInline() {
  document.getElementById('add-habit-inline').style.display = 'flex';
  document.getElementById('add-habit-tracker-btn').style.display = 'none';
  document.getElementById('new-habit-input').value = '';
  document.getElementById('new-habit-input').focus();
}

function cancelAddHabit() {
  document.getElementById('add-habit-inline').style.display = 'none';
  document.getElementById('add-habit-tracker-btn').style.display = 'block';
}

function confirmAddHabit() {
  const val = document.getElementById('new-habit-input').value.trim();
  if (!val) return;
  habits.push(val);
  localStorage.setItem('habit_list', JSON.stringify(habits));
  cancelAddHabit();
  buildLegend();
  setupCanvas();
}

function removeHabit(idx) {
  if (habits.length <= 1) { alert('You need at least one habit.'); return; }

  // Animate the item out first, then remove
  const items = document.querySelectorAll('#legend-list .legend-item');
  const target = items[idx];
  if (target) {
    target.style.animation = 'slideOutLeft 0.2s ease both';
    target.addEventListener('animationend', () => {
      habits.splice(idx, 1);
      localStorage.setItem('habit_list', JSON.stringify(habits));
      const updated = {};
      Object.entries(markedCells).forEach(([key, color]) => {
        const [d, h] = key.split('-').map(Number);
        if (h === idx) return;
        const newH = h > idx ? h - 1 : h;
        updated[`${d}-${newH}`] = color;
      });
      markedCells = updated;
      localStorage.setItem(storageKey, JSON.stringify(markedCells));
      buildLegend();
      setupCanvas();
    }, { once: true });
  }
}

function updateStats() {}

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('habit_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  if (canvas) redraw();
}

// Restore saved theme
if (localStorage.getItem('habit_theme') === 'dark') {
  document.body.classList.add('dark');
}


function showResetConfirm() {
  document.getElementById('confirm-bar').style.display = 'flex';
  document.getElementById('reset-btn').style.display = 'none';
}

function hideResetConfirm() {
  document.getElementById('confirm-bar').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'block';
}

function confirmReset() {
  markedCells = {};
  localStorage.removeItem(storageKey);
  hideResetConfirm();
  redraw();
  updateStats();
}

function showSetup() {
  document.getElementById('tracker-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('color-popup').classList.remove('open');
  document.getElementById('color-fab').style.display = 'none';

  // Sync habit inputs with current habits array
  const wrap = document.getElementById('habit-inputs');
  wrap.innerHTML = '';
  habits.forEach(h => addHabitInput(h));
}

window.addEventListener('resize', () => {
  if (document.getElementById('tracker-screen').style.display !== 'none' && canvas) {
    setupCanvas();
  }
});
</script>
