
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Habit Tracker 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff0f5;
    --surface: #ffffff;
    --text: #3d2040;
    --muted: #b085a0;
    --border: #f5c6df;
    --accent: #ff6b9d;
    --accent-light: #ffe0ef;
    --accent2: #ff9ec4;
    --miss: #fce4f0;
    --radius: 16px;
    --canvas-miss: #f9d0e8;
    --canvas-bg: #fff0f5;
    --canvas-label: #c87faa;
    --bow: #ff6b9d;
    --star: #ffd700;
    --card-shadow: 0 8px 40px rgba(255, 107, 157, 0.18), 0 2px 8px rgba(255,107,157,0.10);
  }

  /* === ORIGINAL THEME === */
  body.theme-original {
    --bg: #f5f2eb;
    --surface: #ffffff;
    --text: #1a1a1a;
    --muted: #7a7a72;
    --border: #e0ddd4;
    --accent: #2c5f4a;
    --accent-light: #e1f0e8;
    --accent2: #3d8b6a;
    --miss: #e8e4dc;
    --canvas-miss: #e8e4dc;
    --canvas-bg: #f5f2eb;
    --canvas-label: #7a7a72;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.07);
  }

  body.theme-original.dark {
    --bg: #161614;
    --surface: #1f1f1c;
    --text: #ffffff;
    --muted: #aaaaaa;
    --border: #2e2e28;
    --accent: #3d8b6a;
    --accent-light: #1a3328;
    --miss: #2a2a26;
    --canvas-miss: #2a2a26;
    --canvas-bg: #161614;
    --canvas-label: #aaaaaa;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }

  body.dark {
    --bg: #1a0d17;
    --surface: #261320;
    --text: #ffe0ef;
    --muted: #cc99bb;
    --border: #4a2040;
    --accent: #ff6b9d;
    --accent-light: #3d1535;
    --accent2: #ff9ec4;
    --miss: #2e1226;
    --canvas-miss: #2e1226;
    --canvas-bg: #1a0d17;
    --canvas-label: #cc99bb;
    --card-shadow: 0 8px 40px rgba(255, 107, 157, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  *:not(canvas) {
    transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
    overflow-y: auto;
    transition: background 0.4s ease, color 0.4s ease;
  }

  /* floating hearts bg */
  body::before {
    content: '♡ 🐱 ♡ 🐱 ♡ 🐱 ♡ 🐱 ♡ 🐱';
    position: fixed;
    top: 0; left: 0; right: 0;
    font-size: 18px;
    color: var(--border);
    letter-spacing: 2.5rem;
    padding: 1rem 2rem;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
  }

  /* SETUP SCREEN */
  #setup-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    position: relative;
    z-index: 1;
    box-sizing: border-box;
  }

  .setup-card {
    background: var(--surface);
    border-radius: 28px;
    border: 2.5px solid var(--border);
    padding: 2.25rem 2rem;
    width: 100%;
    max-width: 560px;
    box-shadow: var(--card-shadow);
    position: relative;
    overflow: visible;
  }

  /* Hello Kitty bow decoration on card */
  .setup-card::before {
    content: '';
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 28px;
    background: var(--bow);
    border-radius: 50% 50% 0 0 / 80% 80% 0 0;
    clip-path: polygon(0% 100%, 50% 0%, 100% 100%);
    filter: drop-shadow(0 2px 6px rgba(255,107,157,0.4));
    display: none;
  }

  .logo {
    font-family: 'Pacifico', cursive;
    font-size: 2rem;
    color: var(--accent);
    margin-bottom: 0.25rem;
    text-shadow: 2px 2px 0 #ffd6eb, 4px 4px 0 rgba(255,107,157,0.15);
    letter-spacing: 0.01em;
  }

  .logo span { color: var(--text); }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    font-weight: 700;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
    font-weight: 800;
  }

  .month-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,157,0.18);
  }

  .habits-section { margin-bottom: 1.5rem; }

  .habit-input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .habit-input-row input {
    flex: 1;
    padding: 0.5rem 0.75rem;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    outline: none;
  }

  .habit-input-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,107,157,0.15); }

  .remove-btn {
    width: 36px;
    height: 38px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-family: 'Nunito', sans-serif;
  }

  .remove-btn:hover { background: #fff0f0; border-color: #ffb3c8; color: #e05080; }

  .add-habit-btn {
    width: 100%;
    padding: 0.55rem;
    border: 2px dashed var(--border);
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    margin-top: 1rem;
  }

  .add-habit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .color-section { margin-bottom: 1.75rem; }

  .color-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .color-preset {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .color-preset:hover { transform: scale(1.18); }
  .color-preset.selected { border-color: var(--text); transform: scale(1.18); }

  .color-custom {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    overflow: hidden;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    position: relative;
  }

  .color-custom input[type="color"] {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .generate-btn {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #ff6b9d 0%, #ff9ec4 100%);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 18px rgba(255,107,157,0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }

  .generate-btn:hover { opacity: 0.93; box-shadow: 0 6px 24px rgba(255,107,157,0.5); }
  .generate-btn:active { transform: scale(0.98); }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spinIn {
    from { opacity: 0; transform: rotate(-45deg) scale(0.85); }
    to   { opacity: 1; transform: rotate(0deg) scale(1); }
  }

  @keyframes heartPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  #tracker-screen.animate-in {
    animation: fadeInUp 0.35s ease both;
  }

  #radial-canvas.animate-in {
    animation: spinIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* TRACKER SCREEN */
  #tracker-screen {
    display: none;
    height: 100vh;
    max-height: 100vh;
    padding: 0;
    max-width: 100%;
    flex-direction: column;
    position: relative;
    z-index: 1;
    overflow: hidden;
  }

  .tracker-header {
    display: flex;
    align-items: center;
    border-bottom: 2px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(255,107,157,0.10);
  }

  .tracker-header-left {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0.875rem 1rem 0.875rem 1.5rem;
    border-right: 2px solid var(--border);
  }

  .tracker-header-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.875rem 1rem;
  }

  .tracker-header-right {
    display: flex;
    justify-content: flex-end;
    padding: 0.875rem 1.5rem 0.875rem 0;
  }

  .tracker-body {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 56px);
  }

  .habits-sidebar {
    width: 280px;
    flex-shrink: 0;
    padding: 1.25rem 1rem;
    border-right: 2px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .habits-sidebar .legend-card {
    border: none;
    padding: 0;
    margin-bottom: 0;
    flex: 1;
  }

  .habits-sidebar .reset-btn {
    margin-top: auto;
    flex-shrink: 0;
    margin-bottom: 1rem;
  }

  .chart-col {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    min-width: 0;
    background: var(--bg);
  }

  .tracker-title {
    font-family: 'Pacifico', cursive;
    font-size: 1.35rem;
    color: var(--accent);
    text-shadow: 1px 1px 0 #ffd6eb;
  }

  .tracker-month {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
  }

  .back-btn {
    padding: 0.4rem 0.85rem;
    border: 2px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .back-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* RADIAL CHART */
  .chart-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0.5rem 0 1.25rem;
  }

  #radial-canvas {
    touch-action: none;
    display: block;
    filter: drop-shadow(0 4px 24px rgba(255,107,157,0.18));
  }

  .chart-center-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .chart-center-label .month-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    font-weight: 800;
  }

  .chart-center-label .year-label {
    font-family: 'Pacifico', cursive;
    font-size: 1.45rem;
    color: var(--accent);
    display: block;
    text-shadow: 1px 1px 0 #ffd6eb;
  }

  /* kitty icon in center */
  .chart-center-label::after {
    content: '♡';
    font-size: 11px;
    color: var(--accent);
    margin-top: 2px;
    opacity: 0.7;
  }

  /* LEGEND */
  .legend-card {
    background: var(--surface);
    border-radius: 20px;
    border: 2px solid var(--border);
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .legend-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
    font-weight: 800;
  }

  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .legend-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 800;
    box-shadow: 0 2px 6px rgba(255,107,157,0.35);
  }

  /* DARK MODE TOGGLE */
  .theme-toggle {
    width: 44px;
    height: 24px;
    background: var(--border);
    border-radius: 12px;
    border: none;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .theme-toggle::after {
    content: '🐱';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s, background 0.2s;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 18px;
    text-align: center;
  }

  body.dark .theme-toggle { background: var(--accent); }
  body.dark .theme-toggle::after { transform: translateX(20px); }

  .tracker-header-left {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  /* COLOR FAB + POPUP */
  .color-fab {
    position: fixed;
    bottom: 1.5rem;
    right: 1.25rem;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,107,157,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: transform 0.15s;
    background: linear-gradient(135deg, #ff6b9d, #ff9ec4);
  }

  .color-fab:hover { transform: scale(1.10); }
  .color-fab-icon { font-size: 20px; pointer-events: none; user-select: none; }

  .color-popup {
    position: fixed;
    bottom: 5.5rem;
    right: 1.25rem;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 0.75rem;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    z-index: 99;
    box-shadow: 0 8px 32px rgba(255,107,157,0.20);
    width: 52px;
  }

  .color-popup.open { display: flex; }

  .color-popup-label { display: none; }

  .color-popup-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .cp-swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }

  .cp-swatch:hover { transform: scale(1.22); }

  .cp-swatch.active {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--bg);
  }

  .cp-close-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    margin-top: 2px;
    font-family: 'Nunito', sans-serif;
  }

  .cp-close-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .legend-remove-btn {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    line-height: 1;
    padding: 0;
    font-family: 'Nunito', sans-serif;
  }

  .legend-remove-btn:hover { background: #fff0f0; border-color: #ffb3c8; color: #e05080; }

  .add-habit-inline {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-top: 0.75rem;
  }

  .add-habit-inline input {
    flex: 1;
    padding: 0.45rem 0.75rem;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    outline: none;
  }

  .add-habit-inline input:focus { border-color: var(--accent); }

  .reset-btn {
    display: block;
    width: 100%;
    padding: 0.75rem;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    margin-top: 0.75rem;
    transition: all 0.15s;
  }

  .reset-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .confirm-bar {
    display: none;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--accent-light);
    border: 2px solid var(--border);
    border-radius: 14px;
    font-size: 12px;
    color: var(--accent);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
  }

  .confirm-bar span { flex: 1; }

  .confirm-yes {
    padding: 0.35rem 0.75rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .confirm-yes:hover { opacity: 0.88; }

  .confirm-no {
    padding: 0.35rem 0.75rem;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--border);
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .tooltip {
    position: fixed;
    background: rgba(61,32,64,0.92);
    color: #ffe0ef;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    pointer-events: none;
    display: none;
    z-index: 200;
    white-space: nowrap;
    border: 1.5px solid rgba(255,107,157,0.35);
  }

  /* kitty paw stamp on generate btn */
  .generate-btn::before {
    content: '🎀 ';
  }

  /* scrollbar styling */
  .habits-sidebar::-webkit-scrollbar { width: 4px; }
  .habits-sidebar::-webkit-scrollbar-track { background: transparent; }
  .habits-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* === ORIGINAL THEME FONT OVERRIDES === */
  body.theme-original {
    font-family: 'DM Mono', monospace;
  }
  body.theme-original .logo,
  body.theme-original .tracker-title {
    font-family: 'DM Serif Display', serif;
    text-shadow: none;
    color: var(--text);
  }

<script>
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

let selectedColor = (localStorage.getItem('habit_app_theme') === 'original') ? '#2c5f4a' : '#ff6b9d';
let habits = [];
let monthIndex = 0;
let year = 2026;
let daysInMonth = 31;
let markedCells = {}; // key: "day-habitIdx" => color string
let storageKey = '';

// Canvas drawing state
let canvas, ctx;
let segments = []; // {day, habitIdx, x, y, w, h, path} — using arc paths
let cellPaths = []; // for hit testing

const now = new Date();

// Init
document.getElementById('sel-month').value = now.getMonth();
document.getElementById('inp-year').value = now.getFullYear();

const savedHabits = localStorage.getItem('habit_list');
const initHabits = savedHabits ? JSON.parse(savedHabits) : ['Wake up early','Drink water','Read 10 pages'];
initHabits.forEach(h => addHabitInput(h));

function addHabitInput(val='') {
  const wrap = document.getElementById('habit-inputs');
  const row = document.createElement('div');
  row.className = 'habit-input-row';
  row.innerHTML = `<input type="text" placeholder="e.g. Exercise" value="${val}"><button class="remove-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
  row.querySelector('input').focus();
}

function pickPreset(el) {
  document.querySelectorAll('.color-preset').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

function pickCustom(val) {
  selectedColor = val;
  document.querySelectorAll('.color-preset').forEach(e => e.classList.remove('selected'));
  if (canvas) redraw();
}

const PALETTE = [
  '#ff6b9d','#ff9ec4','#e05080','#c879d4',
  '#a855f7','#6366f1','#22b8cf','#10b981',
  '#f59e0b','#ef4444',
];

function buildColorPopup() {
  const grid = document.getElementById('cp-grid');
  grid.innerHTML = '';
  PALETTE.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'cp-swatch' + (color === selectedColor ? ' active' : '');
    sw.style.background = color;
    sw.title = color;
    sw.onclick = () => pickPopupColor(color);
    grid.appendChild(sw);
  });
}

function pickPopupColor(color) {
  selectedColor = color;
  document.querySelectorAll('.cp-swatch').forEach(s => {
    s.classList.toggle('active', s.style.background === hexToRgb(color) || s.title === color);
  });
  buildLegend();
  redraw();
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function closeColorPopup() {
  document.getElementById('color-popup').classList.remove('open');
  if (window.innerWidth > 700) {
    document.getElementById('color-fab').style.display = 'flex';
  }
}

function openColorPopup() {
  buildColorPopup();
  document.getElementById('color-popup').classList.add('open');
  if (window.innerWidth > 700) {
    document.getElementById('color-fab').style.display = 'none';
  }
}

function generateTracker() {
  const inputs = document.querySelectorAll('#habit-inputs input[type="text"]');
  habits = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);
  if (habits.length === 0) { alert('Please add at least one habit.'); return; }
  localStorage.setItem('habit_list', JSON.stringify(habits));

  monthIndex = parseInt(document.getElementById('sel-month').value);
  year = parseInt(document.getElementById('inp-year').value) || now.getFullYear();
  daysInMonth = new Date(year, monthIndex + 1, 0).getDate();

  storageKey = `habit_${year}_${monthIndex}`;
  const saved = localStorage.getItem(storageKey);
  markedCells = saved ? JSON.parse(saved) : {};

  document.getElementById('setup-screen').style.display = 'none';
  const ts = document.getElementById('tracker-screen');
  ts.style.display = 'flex';
  ts.classList.remove('animate-in');
  requestAnimationFrame(() => ts.classList.add('animate-in'));

  // Auto-open the colour bar, hide FAB
  buildColorPopup();
  document.getElementById('color-popup').classList.add('open');
  if (window.innerWidth > 700) {
    document.getElementById('color-fab').style.display = 'none';
  }

  document.getElementById('tracker-month-label').textContent = `${MONTHS[monthIndex]} ${year}`;
  document.getElementById('center-month').textContent = MONTH_SHORT[monthIndex];
  document.getElementById('center-year').textContent = year;

  buildLegend();
  setupCanvas(true);
  updateStats();
  applyAppTheme();
  repositionColorPopup();
  requestAnimationFrame(checkSidebarScroll);
  if (window.innerWidth <= 700) {
    _drawerOpen = false;
    const sidebar = document.querySelector('.habits-sidebar');
    const chevron = document.getElementById('drawer-chevron');
    const chip = document.getElementById('drawer-chip');
    if (sidebar) sidebar.classList.remove('drawer-open');
    if (chevron) chevron.style.transform = '';
    if (chip) chip.textContent = 'menu';
  }
}

function buildLegend() {
  const list = document.getElementById('legend-list');
  list.innerHTML = '';
  habits.forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-num" style="background:${selectedColor}">${i+1}</div>
      <span style="flex:1">${h}</span>
      <button class="legend-remove-btn" onclick="removeHabit(${i})" title="Remove">×</button>
    `;
    list.appendChild(item);
  });
  requestAnimationFrame(checkSidebarScroll);
}

function setupCanvas(animate = false) {
  canvas = document.getElementById('radial-canvas');
  ctx = canvas.getContext('2d');

  const isMobile = window.innerWidth <= 700;
  const headerH = document.querySelector('.tracker-header')?.offsetHeight || 56;
  const pad = 8;

  let canvasW, canvasH;

  if (isMobile) {
    const chartCol = canvas.closest('.chart-col');
    const colW = chartCol?.clientWidth || window.innerWidth;
    const colH = chartCol?.clientHeight || (window.innerHeight - headerH - 36);
    canvasW = colW;
    canvasH = colH;
  } else {
    const sidebar = document.querySelector('.habits-sidebar');
    const sidebarW = sidebar?.offsetWidth || 280;
    const availW = window.innerWidth - sidebarW - pad * 2;
    const availH = window.innerHeight - headerH - pad * 2;
    const size = Math.min(availW, availH, 620);
    canvasW = size;
    canvasH = size;
  }

  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvasW * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  canvas.style.transform = '';
  canvas.style.transformOrigin = '';

  if (animate) {
    canvas.classList.remove('animate-in');
    requestAnimationFrame(() => canvas.classList.add('animate-in'));
  }

  canvas.addEventListener('click', handleCanvasClick);
  canvas.addEventListener('mousemove', handleMouseMove);
  canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display='none'; });

  // Touch handling: pinch-to-zoom + pan + tap
  let _touchZoom = 1, _touchPanX = 0, _touchPanY = 0;
  let _pinchStartDist = 0, _pinchStartZoom = 1;
  let _panStartX = 0, _panStartY = 0, _panStartPanX = 0, _panStartPanY = 0;
  let _touchMoved = false, _tapStartX = 0, _tapStartY = 0;

  function _applyTransform() {
    const maxPan = (canvas.offsetWidth * _touchZoom - canvas.offsetWidth) / 2 + 40;
    _touchPanX = Math.max(-maxPan, Math.min(maxPan, _touchPanX));
    _touchPanY = Math.max(-maxPan, Math.min(maxPan, _touchPanY));
    canvas.style.transform = `scale(${_touchZoom}) translate(${_touchPanX / _touchZoom}px, ${_touchPanY / _touchZoom}px)`;
    canvas.style.transformOrigin = 'center center';
  }

  function _pinchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      _tapStartX = e.touches[0].clientX;
      _tapStartY = e.touches[0].clientY;
      _panStartX = e.touches[0].clientX;
      _panStartY = e.touches[0].clientY;
      _panStartPanX = _touchPanX;
      _panStartPanY = _touchPanY;
      _touchMoved = false;
    } else if (e.touches.length === 2) {
      _pinchStartDist = _pinchDist(e.touches);
      _pinchStartZoom = _touchZoom;
      _touchMoved = true;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 2) {
      const dist = _pinchDist(e.touches);
      _touchZoom = Math.max(1, Math.min(4, _pinchStartZoom * (dist / _pinchStartDist)));
      if (_touchZoom === 1) { _touchPanX = 0; _touchPanY = 0; }
      _applyTransform();
      _touchMoved = true;
    } else if (e.touches.length === 1 && _touchZoom > 1) {
      const dx = e.touches[0].clientX - _panStartX;
      const dy = e.touches[0].clientY - _panStartY;
      _touchPanX = _panStartPanX + dx;
      _touchPanY = _panStartPanY + dy;
      _applyTransform();
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) _touchMoved = true;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    if (!_touchMoved && e.changedTouches.length === 1) {
      // Map touch to CSS pixel canvas coords (cellPaths are in CSS px space)
      const rect = canvas.getBoundingClientRect();
      const touch = e.changedTouches[0];
      const x = (touch.clientX - rect.left) * (parseFloat(canvas.style.width) / rect.width);
      const y = (touch.clientY - rect.top) * (parseFloat(canvas.style.height) / rect.height);
      const cell = getCellFromPoint(x, y);
      if (cell) {
        if (markedCells[cell.key]) { delete markedCells[cell.key]; }
        else { markedCells[cell.key] = selectedColor; }
        localStorage.setItem(storageKey, JSON.stringify(markedCells));
        redraw();
        updateStats();
      }
    }
    if (e.touches.length === 0 && _touchZoom <= 1.05) {
      _touchZoom = 1; _touchPanX = 0; _touchPanY = 0;
      _applyTransform();
    }
  }, { passive: false });

  redraw();
}

function getArcParams(canvasW, canvasH) {
  const diameter = Math.min(canvasW, canvasH);
  const cx = canvasW / 2;
  const cy = canvasH / 2;
  const isMobile = window.innerWidth <= 700;
  const labelMargin = isMobile ? diameter * 0.07 : diameter * 0.10;
  const innerR = isMobile ? diameter * 0.10 : diameter * 0.18;
  const outerR = diameter * 0.5 - labelMargin;
  const ringW = (outerR - innerR) / habits.length;
  return { cx, cy, innerR, outerR, ringW, diameter };
}

function redraw() {
  const canvasW = parseFloat(canvas.style.width) || canvas.width;
  const canvasH = parseFloat(canvas.style.height) || canvas.height;
  const { cx, cy, innerR, outerR, ringW, diameter } = getArcParams(canvasW, canvasH);
  const size = diameter;
  ctx.clearRect(0, 0, canvasW, canvasH);

  cellPaths = [];

  const totalDays = daysInMonth;
  const anglePerDay = (2 * Math.PI) / totalDays;
  const gap = 0.018;

  const fontSize = Math.round(Math.max(8, size * 0.026));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.imageSmoothingEnabled = false;

  // Read CSS vars for theme-aware colors
  const style = getComputedStyle(document.body);
  const missColor = style.getPropertyValue('--canvas-miss').trim() || '#f9d0e8';
  const bgColor = style.getPropertyValue('--canvas-bg').trim() || '#fff0f5';
  const labelColor = style.getPropertyValue('--canvas-label').trim() || '#c87faa';

  // Draw cells + labels
  for (let d = 1; d <= totalDays; d++) {
    const dayAngle = -Math.PI / 2 + (d - 1) * anglePerDay;
    const midAngle = dayAngle + anglePerDay / 2;

    // Day number label — placed just outside the outermost ring
    const labelR = outerR + size * 0.04;
    const lx = Math.round(cx + Math.cos(midAngle) * labelR);
    const ly = Math.round(cy + Math.sin(midAngle) * labelR);
    ctx.font = `800 ${fontSize}px Nunito, sans-serif`;
    ctx.fillStyle = labelColor;
    ctx.fillText(d, lx, ly);

    // Draw a small dot below today's date number
    if (d === now.getDate() && monthIndex === now.getMonth() && year === now.getFullYear()) {
      const dotR = Math.max(2, size * 0.007);
      const dotOffset = fontSize * 1.3;
      const dotX = lx + Math.cos(midAngle) * dotOffset;
      const dotY = ly + Math.sin(midAngle) * dotOffset;
      ctx.beginPath();
      ctx.arc(dotX, dotY, dotR, 0, 2 * Math.PI);
      ctx.fillStyle = selectedColor;
      ctx.fill();
    }

    for (let h = 0; h < habits.length; h++) {
      const ringIdx = habits.length - 1 - h;
      const r1 = innerR + ringIdx * ringW + 1;
      const r2 = innerR + (ringIdx + 1) * ringW - 1;
      const a1 = dayAngle + gap;
      const a2 = dayAngle + anglePerDay - gap;
      const key = `${d}-${h}`;
      const marked = markedCells[key];

      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1);
      ctx.arc(cx, cy, r2, a1, a2);
      ctx.arc(cx, cy, r1, a2, a1, true);
      ctx.closePath();

      ctx.fillStyle = marked ? marked : missColor;
      ctx.fill();

      cellPaths.push({ day: d, habitIdx: h, cx, cy, r1, r2, a1, a2, key });
    }
  }

  // Inner circle fill
  ctx.beginPath();
  ctx.arc(cx, cy, innerR - 1, 0, 2 * Math.PI);
  ctx.fillStyle = bgColor;
  ctx.fill();
}

function pointInCell(px, py, cell) {
  const { cx, cy, r1, r2, a1, a2 } = cell;
  const dx = px - cx, dy = py - cy;
  const r = Math.sqrt(dx*dx + dy*dy);
  if (r < r1 || r > r2) return false;
  let angle = Math.atan2(dy, dx);
  // Normalize angles
  let na1 = a1, na2 = a2;
  while (na1 < -Math.PI) { na1 += 2*Math.PI; na2 += 2*Math.PI; }
  while (na2 > Math.PI) { na1 -= 2*Math.PI; na2 -= 2*Math.PI; }
  if (na1 > na2) { const tmp = na1; na1 = na2; na2 = tmp; }
  // Adjust angle
  while (angle < na1 - 0.01) angle += 2*Math.PI;
  while (angle > na2 + 0.01) angle -= 2*Math.PI;
  return angle >= na1 && angle <= na2;
}

function getCellFromPoint(px, py) {
  for (let i = cellPaths.length - 1; i >= 0; i--) {
    if (pointInCell(px, py, cellPaths[i])) return cellPaths[i];
  }
  return null;
}

function getCanvasXY(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = parseFloat(canvas.style.width) / rect.width;
  const scaleY = parseFloat(canvas.style.height) / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY,
    clientX, clientY
  };
}

function handleCanvasClick(e) {
  const { x, y } = getCanvasXY(e);
  const cell = getCellFromPoint(x, y);
  if (!cell) return;
  if (markedCells[cell.key]) {
    delete markedCells[cell.key];
  } else {
    markedCells[cell.key] = selectedColor;
  }
  localStorage.setItem(storageKey, JSON.stringify(markedCells));
  redraw();
  updateStats();
}

function handleMouseMove(e) {
  const { x, y, clientX, clientY } = getCanvasXY(e);
  const cell = getCellFromPoint(x, y);
  const tt = document.getElementById('tooltip');
  if (cell) {
    canvas.style.cursor = 'pointer';
    tt.style.display = 'block';
    tt.style.left = (clientX + 12) + 'px';
    tt.style.top = (clientY - 28) + 'px';
    tt.textContent = `Day ${cell.day} · ${habits[cell.habitIdx]}`;
  } else {
    canvas.style.cursor = 'default';
    tt.style.display = 'none';
  }
}

function showAddHabitInline() {
  document.getElementById('add-habit-inline').style.display = 'flex';
  document.getElementById('add-habit-tracker-btn').style.display = 'none';
  document.getElementById('new-habit-input').value = '';
  document.getElementById('new-habit-input').focus();
}

function cancelAddHabit() {
  document.getElementById('add-habit-inline').style.display = 'none';
  document.getElementById('add-habit-tracker-btn').style.display = 'block';
}

function confirmAddHabit() {
  const val = document.getElementById('new-habit-input').value.trim();
  if (!val) return;
  habits.push(val);
  localStorage.setItem('habit_list', JSON.stringify(habits));
  cancelAddHabit();
  buildLegend();
  setupCanvas();
}

function removeHabit(idx) {
  if (habits.length <= 1) { alert('You need at least one habit.'); return; }

  habits.splice(idx, 1);
  localStorage.setItem('habit_list', JSON.stringify(habits));
  const updated = {};
  Object.entries(markedCells).forEach(([key, color]) => {
    const [d, h] = key.split('-').map(Number);
    if (h === idx) return;
    const newH = h > idx ? h - 1 : h;
    updated[`${d}-${newH}`] = color;
  });
  markedCells = updated;
  localStorage.setItem(storageKey, JSON.stringify(markedCells));
  buildLegend();
  setupCanvas();
}

function updateStats() {}

// ===== APP THEME (Original vs Kitty) =====
let appTheme = localStorage.getItem('habit_app_theme') || 'kitty';

function selectAppTheme(theme) {
  appTheme = theme;
  localStorage.setItem('habit_app_theme', theme);
  applyAppTheme();
}

function applyAppTheme() {
  const isOriginal = appTheme === 'original';
  document.body.classList.toggle('theme-original', isOriginal);

  // Update active card
  document.getElementById('tc-original').classList.toggle('active', isOriginal);
  document.getElementById('tc-kitty').classList.toggle('active', !isOriginal);

  // Set default selectedColor for each theme
  selectedColor = isOriginal ? '#2c5f4a' : '#ff6b9d';

  // Swap logo & tagline text
  const logo = document.getElementById('setup-logo');
  const tagline = document.getElementById('setup-tagline');
  const trackerTitle = document.getElementById('tracker-title-el');
  if (isOriginal) {
    logo.innerHTML = 'habit<span>.</span>';
    tagline.textContent = 'Monthly Radial Tracker';
    if (trackerTitle) trackerTitle.innerHTML = 'habit<span style="color:var(--accent)">.</span>';
    document.querySelectorAll('.add-habit-btn').forEach(b => { b.textContent = b.textContent.replace('🐱 ', '+ '); });
    const sidebarBtn = document.getElementById('add-habit-tracker-btn');
    if (sidebarBtn) sidebarBtn.textContent = '+ add habit';
    const legendTitle = document.getElementById('legend-title-el');
    if (legendTitle) legendTitle.textContent = 'MY HABITS';
  } else {
    logo.innerHTML = 'habit<span>🐱</span>';
    tagline.textContent = '🐱 Monthly Radial Tracker 🐱';
    if (trackerTitle) trackerTitle.innerHTML = 'habit<span style="color:var(--text)">🐱</span>';
    document.querySelectorAll('.add-habit-btn').forEach(b => { b.textContent = b.textContent.replace('+ ', '🐱 '); });
    const sidebarBtn = document.getElementById('add-habit-tracker-btn');
    if (sidebarBtn) sidebarBtn.textContent = '🐱 add habit';
    const legendTitle = document.getElementById('legend-title-el');
    if (legendTitle) legendTitle.textContent = '🐱 My Habits';
  }

  if (canvas) { buildLegend(); redraw(); }
}

// Restore app theme on load
applyAppTheme();

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('habit_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  if (canvas) redraw();
}

// Restore saved theme
if (localStorage.getItem('habit_theme') === 'dark') {
  document.body.classList.add('dark');
}


function showResetConfirm() {
  document.getElementById('confirm-bar').style.display = 'flex';
  document.getElementById('reset-btn').style.display = 'none';
}

function hideResetConfirm() {
  document.getElementById('confirm-bar').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'block';
}

function confirmReset() {
  markedCells = {};
  localStorage.removeItem(storageKey);
  hideResetConfirm();
  redraw();
  updateStats();
}

function showSetup() {
  document.getElementById('tracker-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('color-popup').classList.remove('open');
  document.getElementById('color-fab').style.display = 'none';

  // Sync habit inputs with current habits array
  const wrap = document.getElementById('habit-inputs');
  wrap.innerHTML = '';
  habits.forEach(h => addHabitInput(h));
}

// ===== MOBILE DRAWER =====
let _drawerOpen = false;

function toggleMobileDrawer() {
  if (window.innerWidth > 700) return;
  _drawerOpen = !_drawerOpen;
  const sidebar = document.querySelector('.habits-sidebar');
  const chevron = document.getElementById('drawer-chevron');
  const chip = document.getElementById('drawer-chip');
  if (sidebar) sidebar.classList.toggle('drawer-open', _drawerOpen);
  if (chevron) chevron.style.transform = _drawerOpen ? 'rotate(180deg)' : '';
  if (chip) chip.textContent = _drawerOpen ? 'close' : 'menu';
  setTimeout(() => { if (canvas) setupCanvas(); }, 340);
}

// ===== MOBILE: relocate color popup into sidebar =====
const _colorPopup = document.getElementById('color-popup');
const _colorPopupOriginalParent = _colorPopup.parentElement;
const _colorPopupNextSibling = _colorPopup.nextElementSibling;

function repositionColorPopup() {
  const sidebar = document.querySelector('.habits-sidebar');
  if (window.innerWidth <= 700) {
    if (sidebar && _colorPopup.parentElement !== sidebar) {
      sidebar.insertBefore(_colorPopup, sidebar.firstChild);
    }
  } else {
    if (_colorPopup.parentElement !== _colorPopupOriginalParent) {
      if (_colorPopupNextSibling) {
        _colorPopupOriginalParent.insertBefore(_colorPopup, _colorPopupNextSibling);
      } else {
        _colorPopupOriginalParent.appendChild(_colorPopup);
      }
    }
  }
}

repositionColorPopup();

// ===== MOBILE: enable sidebar scroll only when content overflows =====
function checkSidebarScroll() {
  // Drawer handles its own scroll via overflow-y: auto when open
}

window.addEventListener('resize', () => {
  repositionColorPopup();
  checkSidebarScroll();
  if (document.getElementById('tracker-screen').style.display !== 'none' && canvas) {
    setupCanvas();
  }
});

// Disable pinch-to-zoom on mobile (exclude canvas so cell taps still work)
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) {
    // Allow pinch on canvas itself
    if (e.target === document.getElementById('radial-canvas')) return;
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('gesturestart', function(e) {
  if (e.target !== document.getElementById('radial-canvas')) e.preventDefault();
}, { passive: false });
</script>
